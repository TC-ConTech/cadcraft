[package]
name = "cadcraft-io"
description = "CADCraft file formats: DXF read/write mapping, SVG, PNG and PDF export"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["pdf", "dwg"]
pdf = ["dep:craft-pdf"]
dwg = ["cadcraft-dwg/dwg"]

[dependencies]
cadcraft-geom = { workspace = true }
cadcraft-color = { workspace = true }
cadcraft-doc = { workspace = true }
cadcraft-dxf = { workspace = true }
cadcraft-dwg = { workspace = true, default-features = false }
cadcraft-render = { workspace = true }
cadcraft-fonts = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
miniz_oxide = "0.9"
craft-pdf = { workspace = true, features = ["write"], optional = true }
quick-xml = { workspace = true }
image = { workspace = true }

[dev-dependencies]
tiny-skia = { workspace = true }
